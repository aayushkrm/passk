name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: lint, type, test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies (no llama-cpp-python)
        run: uv sync --locked --python ${{ matrix.python-version }} --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

      - name: Tests (model tests skipped)
        run: uv run pytest -m "not model"

      - name: Check results
        run: make check-results

      - name: Dogfood (validate smoke, gate on fixtures)
        if: matrix.python-version == '3.11'
        run: make dogfood
