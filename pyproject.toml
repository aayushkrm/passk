[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "passk"
version = "0.1.0"
description = "pass^k for tool-using agents: an offline, CI-gated reliability harness that measures whether your agent succeeds every time, not just once."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Ayush Kumar" }]
keywords = ["agents", "evaluation", "reliability", "mcp", "pass-k"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2",
    "typer",
    "pyyaml",
    "numpy",
    "jinja2",
    "mcp>=2",
]

[project.optional-dependencies]
# Local GGUF inference. Native build; not installed in CI.
llama = ["llama-cpp-python==0.3.37"]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
passk = "passk.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/passk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "model: needs a local GGUF model and llama-cpp-python; deselected in CI with -m 'not model'",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
