name: pages

on:
  push:
    branches: [main]
    paths:
      - "results/**"
      - "src/passk/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    # Skips the rest of the pipeline when results/ holds no committed run yet.
    runs-on: ubuntu-latest
    outputs:
      has_results: ${{ steps.check.outputs.has_results }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          count=$(find results -name report.json 2>/dev/null | wc -l | tr -d ' ')
          if [ "$count" -gt 0 ]; then
            echo "has_results=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_results=false" >> "$GITHUB_OUTPUT"
            echo "No results/**/report.json found; skipping Pages deploy."
          fi

  build:
    needs: check
    if: needs.check.outputs.has_results == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies (no llama-cpp-python)
        run: uv sync --locked --python 3.12
      - name: Build site from results/
        run: uv run make site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
